<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background / Base Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Outer Bezel Gradient -->
    <linearGradient id="bezelOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>

    <!-- 3D Inner Plate Cavity -->
    <radialGradient id="plateInner" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1f1f27"/>
      <stop offset="60%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>

    <!-- 3D Isometric Table Platter -->
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="tableRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- 3D Cloche Dome Metallic Shading -->
    <linearGradient id="clocheDome" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="25%" stop-color="#f97316"/>
      <stop offset="65%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="clocheHighlight" cx="35%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#ffedd5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Cloche Handle Knob -->
    <radialGradient id="handleKnob" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="85%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>

    <!-- Digital Link Arc (Ethernet/WiFi/Link Aura) -->
    <linearGradient id="digitalLink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
    <filter id="clocheShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#ambientGlow)"/>

  <!-- 3D Squircle Base Container -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bezelOuter)" filter="url(#shadow3D)"/>
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#plateInner)"/>

  <!-- Subtle Futuristic Grid Lines inside Squircle -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <circle cx="256" cy="256" r="160" fill="none" stroke-dasharray="8 6"/>
    <circle cx="256" cy="256" r="110" fill="none"/>
  </g>

  <!-- 3D Pedestal / Restaurant Table Ellipse (Tepsi / Masa Yüzeyi) -->
  <g filter="url(#shadow3D)">
    <!-- Base Depth / 3D Extrusion -->
    <ellipse cx="256" cy="358" rx="170" ry="46" fill="#0c0a09"/>
    <ellipse cx="256" cy="350" rx="170" ry="46" fill="#1c1917"/>
    <path d="M 86 350 C 86 376, 426 376, 426 350 L 426 362 C 426 388, 86 388, 86 362 Z" fill="url(#tableRim)"/>

    <!-- Platter Top Surface -->
    <ellipse cx="256" cy="346" rx="166" ry="43" fill="url(#tableTop)"/>
    <ellipse cx="256" cy="346" rx="156" ry="38" fill="none" stroke="url(#tableRim)" stroke-width="3"/>
  </g>

  <!-- Dual Digital Link Rings (Interlocking Node Links symbolizing 'Link') -->
  <g opacity="0.9">
    <ellipse cx="210" cy="240" rx="55" ry="24" fill="none" stroke="url(#digitalLink)" stroke-width="5" stroke-dasharray="12 4" transform="rotate(-15 210 240)"/>
    <ellipse cx="302" cy="240" rx="55" ry="24" fill="none" stroke="url(#digitalLink)" stroke-width="5" stroke-dasharray="12 4" transform="rotate(15 302 240)"/>
    <!-- Center synchronization beacon -->
    <circle cx="256" cy="120" r="6" fill="#fed7aa">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 3D Restaurant Cloche (Servis Kapağı / Kubbe) -->
  <g filter="url(#clocheShadow)">
    <!-- Cloche Bottom Rim (3D Ring) -->
    <ellipse cx="256" cy="326" rx="136" ry="34" fill="#7c2d12"/>
    <ellipse cx="256" cy="322" rx="134" ry="32" fill="url(#tableRim)"/>
    
    <!-- Cloche Main Dome -->
    <!-- Path curves from left rim, arcs up smoothly to handle, down to right rim -->
    <path d="M 122 322 C 122 205, 185 142, 256 142 C 327 142, 390 205, 390 322 C 390 334, 122 334, 122 322 Z" fill="url(#clocheDome)"/>

    <!-- 3D Specular Highlight Curves on the Cloche -->
    <path d="M 136 312 C 144 220, 196 156, 256 152 C 235 156, 172 210, 160 310 Z" fill="url(#clocheHighlight)" opacity="0.8"/>

    <!-- Subtle Right Ambient Rim Reflection -->
    <path d="M 376 312 C 368 230, 324 165, 276 154 C 315 168, 354 225, 362 310 Z" fill="#ffffff" opacity="0.2"/>

    <!-- Cloche Handle / Knob (3D Chrome / Gold sphere & collar) -->
    <ellipse cx="256" cy="144" rx="20" ry="7" fill="#7c2d12"/>
    <ellipse cx="256" cy="141" rx="18" ry="6" fill="url(#tableRim)"/>
    <rect x="251" y="128" width="10" height="14" rx="3" fill="#ea580c"/>
    <circle cx="256" cy="122" r="22" fill="url(#handleKnob)" filter="url(#shadow3D)"/>
    <!-- Knob Highlight -->
    <circle cx="249" cy="115" r="7" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Elegant Steam / Signal Waves Rising from Cloche (Smart POS Cloud Link) -->
  <g stroke="url(#tableRim)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 230 92 C 224 80, 234 68, 226 54"/>
    <path d="M 256 86 C 250 72, 262 60, 256 46"/>
    <path d="M 282 92 C 288 80, 278 68, 286 54"/>
  </g>
</svg>
